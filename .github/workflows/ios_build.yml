name: Build Godot iOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Godot Engine
        run: |
          GODOT_VERSION="4.7.2-stable"
          curl -sL https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_macos.universal.zip -o godot.zip
          unzip godot.zip
          mv Godot.app /Applications/Godot.app
        env:
          GODOT_VERSION: "4.7.2-stable"

      - name: Download and Place Export Templates
        run: |
          TEMPLATES_VERSION="4.7.2-stable"
          DIR_VERSION="4.7.2.stable"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${{ env.DIR_VERSION }}"
          
          mkdir -p "$TEMPLATE_DIR"
          curl -sL https://github.com/godotengine/godot/releases/download/${{ env.TEMPLATES_VERSION }}/Godot_v${{ env.TEMPLATES_VERSION }}_export_templates.tpz -o templates.tpz
          
          # Unzip the tpz container (it's a zip file)
          unzip -q templates.tpz
          
          # Godot export_templates.tpz extracts to a folder named 'templates/'
          # Move its contents directly into the expected version folder
          mv templates/* "$TEMPLATE_DIR/"
          
          # List files to verify placement
          ls -la "$TEMPLATE_DIR"
        env:
          TEMPLATES_VERSION: "4.7.2-stable"

      - name: Export Godot Project
        run: |
          mkdir -p build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/game.xcodeproj

      - name: Build Xcode Project to App Bundle
        run: |
          cd build/ios
          XCODEPROJ=$(ls -d *.xcodeproj | head -n 1)
          SCHEME_NAME=$(basename "$XCODEPROJ" .xcodeproj)
          echo "Building project: $XCODEPROJ with scheme: $SCHEME_NAME"
          
          xcodebuild -project "$XCODEPROJ" -scheme "$SCHEME_NAME" -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA Artifact
        run: |
          cd build/ios
          APP_NAME=$(ls -d build/Release-iphoneos/*.app | head -n 1)
          mkdir -p Payload
          cp -r "$APP_NAME" Payload/
          zip -r ../../ios-game.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-game-ipa
          path: ios-game.ipa
