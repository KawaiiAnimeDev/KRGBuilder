name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable   # templates are downloaded automatically, just bump this
  IOS_PRESET:    iOS            # export-preset name in Godot
  NAME:          ${{ github.event.repository.name }}
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    # 0. Pull repo
    - name: Checkout
      uses: actions/checkout@v4

    # 1. Get headless Godot
    - name: Download Godot
      run: |
        curl -fL \
          "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" \
          -o godot.zip
        unzip -q godot.zip -d godot

    # 2. iOS export template (cached per Godot version)
    - name: Set template path
      run: |
        echo "TEMPLATE_DIR=$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION/-/.}" >> "$GITHUB_ENV"

    - name: Cache iOS export template
      id: tpl-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.TEMPLATE_DIR }}
        key: godot-ios-template-${{ env.GODOT_VERSION }}

    - name: Download iOS export template
      if: steps.tpl-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$TEMPLATE_DIR"
        curl -fL \
          "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
          -o templates.tpz
        unzip -q -j templates.tpz "templates/ios.zip" "templates/version.txt" -d "$TEMPLATE_DIR"
        rm templates.tpz

    # 3. Export preset -> Xcode project
    #    Needs application/export_project_only=true and
    #    application/delete_old_export_files_unconditionally=true in the preset.
    - name: Export to Xcode project
      run: |
        mkdir -p build/ios
        godot/Godot.app/Contents/MacOS/Godot --headless --path . \
          --export-release "${IOS_PRESET}" build/ios/${NAME}.xcodeproj

    # 4. Build unsigned archive
    - name: xcodebuild archive (unsigned)
      run: |
        xcodebuild archive \
          -project build/ios/${NAME}.xcodeproj \
          -scheme "${NAME}" \
          -archivePath build/ios/App.xcarchive \
          -configuration Release \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty

    # 5. Package .ipa
    - name: Package IPA
      run: |
        cd build/ios
        mkdir -p Payload
        cp -R App.xcarchive/Products/Applications/*.app Payload/
        zip -r "${NAME}.ipa" Payload
        mv "${NAME}.ipa" ../../

    # 6. Publish artifact
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-ipa
        path: ${{ env.NAME }}.ipa
        retention-days: 14

    # Sideload the IPA with AltStore, SideStore, etc.